            - paragraph [ref=f1e77]: Managing Director
            - paragraph [ref=f1e78]: With Over 15 Years Of Experience In Sales, Leadership, And Real Estate, Haitham Mahdy Has Built A Career Centered On Delivering Exceptional Client Experiences And Sustainable Investment Opportunities. As Managing Director Of SMB Real Estate Brokers, He Leads The Company With A Client-First Philosophy, Combining Strategic Market Insight, Strong Negotiation Skills, And A Commitment To Transparency. His Extensive Industry Knowledge Enables Clients To Make Confident Decisions While Receiving Professional Guidance At Every Stage Of Their Real Estate Journey.
